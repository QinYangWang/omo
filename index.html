<!doctype html>
<html lang="en">
  <head>
    <script>
    "use strict";
    (() => {
      const t = localStorage.getItem("omo:theme") || "dark";
      document.documentElement.classList.toggle("dark", t !== "light");
    })();
    </script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta charset="UTF-8">

    <meta
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:* https:; worker-src 'self' blob:; frame-src http: https:;"
      http-equiv="Content-Security-Policy"
    >
    <title>omo</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
