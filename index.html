<!doctype html>
<html lang="en">
  <head>
    <script>
    "use strict";
    (() => {
      const t = localStorage.getItem("omo:theme") || "dark";
      document.documentElement.classList.toggle("dark", t !== "light");
    })();
    </script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta charset="UTF-8">

    <meta
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:* https:; worker-src 'self' blob:; frame-src http: https:;"
      http-equiv="Content-Security-Policy"
    >
    <title>omo</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="omo-splash">
      <canvas id="omo-splash-canvas"></canvas>
    </div>
    <style>
      #omo-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s ease;
      }
      #omo-splash.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
    "use strict";
    // Port of Show-PiLogoAnimation from https://pi.dev/install.ps1:
    // three tetrominoes drop in to build the pi logo, the bottom row
    // flashes and clears, the logo settles and blinks white.
    (() => {
      const splash = document.getElementById("omo-splash");
      const canvas = document.getElementById("omo-splash-canvas");
      if (!splash || !canvas) return;
      const dark = document.documentElement.classList.contains("dark");
      const bg = dark ? "#0a0a0b" : "#fafafa";
      const fg = dark ? "#fafafa" : "#18181b";
      const colors = {
        cyan: "#22d3ee",
        red: "#f87171",
        green: "#4ade80",
        orange: "#fbbf24",
        white: fg,
        flash: "#fbbf24",
      };
      splash.style.background = bg;
      const COLS = 8, ROWS = 9, CELL = 16, GAP = 2;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = COLS * CELL * dpr;
      canvas.height = ROWS * CELL * dpr;
      canvas.style.width = `${COLS * CELL}px`;
      canvas.style.height = `${ROWS * CELL}px`;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;
      ctx.scale(dpr, dpr);

      const inCells = (y, x, cells) => cells.split(" ").includes(`${y},${x}`);
      const inPiece = (y, x, py, px, cells) =>
        cells.split(" ").some((item) => {
          const [dy, dx] = item.split(",");
          return y === py + Number(dy) && x === px + Number(dx);
        });

      const cellColor = (f, y, x) => {
        if (f.white) {
          return inCells(y, x, "3,2 3,3 3,4 4,2 4,4 5,2 5,3 5,5 6,2 6,5")
            ? colors.white
            : null;
        }
        if (f.flash && y === 6 && x >= 1 && x <= 6) return colors.flash;
        if (f.active === "left" && inPiece(y, x, f.ay, f.ax, "0,0 1,0 1,1 2,0"))
          return colors.red;
        if (f.active === "top" && inPiece(y, x, f.ay, f.ax, "0,0 0,1 0,2 1,2"))
          return colors.cyan;
        if (f.active === "right" && inPiece(y, x, f.ay, f.ax, "0,0 1,0 2,0 2,1"))
          return colors.green;
        const p = f.phase;
        if (p === 4) {
          if (inCells(y, x, "2,2 2,3 2,4 3,4")) return colors.cyan;
          if (inCells(y, x, "3,2 4,2 4,3 5,2")) return colors.red;
          if (inCells(y, x, "4,5 5,5")) return colors.green;
          return null;
        }
        if (p >= 5) {
          if (inCells(y, x, "3,2 3,3 3,4 4,4")) return colors.cyan;
          if (inCells(y, x, "4,2 5,2 5,3 6,2")) return colors.red;
          if (inCells(y, x, "5,5 6,5")) return colors.green;
          return null;
        }
        if (p <= 3 && inCells(y, x, "6,1 6,2 6,3 6,4")) return colors.orange;
        if (p >= 2 && inCells(y, x, "2,2 2,3 2,4 3,4")) return colors.cyan;
        if (p >= 1 && inCells(y, x, "3,2 4,2 4,3 5,2")) return colors.red;
        if (p >= 3 && inCells(y, x, "4,5 5,5 6,5 6,6")) return colors.green;
        return null;
      };

      const frames = [
        ...[0, 1, 2, 3].map((y) => ({ phase: 0, active: "left", ax: 2, ay: y, d: 75 })),
        ...[0, 1, 2].map((y) => ({ phase: 1, active: "top", ax: 2, ay: y, d: 75 })),
        ...[0, 1, 2, 3, 4].map((y) => ({ phase: 2, active: "right", ax: 5, ay: y, d: 75 })),
        { phase: 3, d: 250 },
        { phase: 3, flash: 1, d: 80 },
        { phase: 3, d: 80 },
        { phase: 3, flash: 1, d: 80 },
        { phase: 4, d: 100 },
        { phase: 5, d: 450 },
        { phase: 5, white: 1, d: 120 },
        { phase: 5, d: 120 },
        { phase: 5, white: 1, d: 450 },
      ];
      const total = frames.reduce((sum, f) => sum + f.d, 0);

      let dead = false;
      const start = performance.now();
      const frame = (now) => {
        if (dead) return;
        let t = Math.min(now - start, total - 1);
        let current = frames[frames.length - 1];
        for (const f of frames) {
          if (t < f.d) {
            current = f;
            break;
          }
          t -= f.d;
        }
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
        for (let y = 0; y < ROWS; y++) {
          for (let x = 1; x <= COLS; x++) {
            const color = cellColor(current, y, x);
            if (!color) continue;
            ctx.fillStyle = color;
            ctx.fillRect(
              (x - 1) * CELL + GAP / 2,
              y * CELL + GAP / 2,
              CELL - GAP,
              CELL - GAP
            );
          }
        }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);

      window.omoSplashDone = () => {
        const wait = Math.max(0, total + 150 - (performance.now() - start));
        setTimeout(() => {
          splash.classList.add("done");
          setTimeout(() => {
            dead = true;
            splash.remove();
          }, 400);
        }, wait);
      };
    })();
    </script>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
