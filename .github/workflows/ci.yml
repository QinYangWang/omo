name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # mygo v0.7.3 requires go 1.27.3; pinning it here keeps CI off whatever
  # toolchain a runner happens to ship.
  GOTOOLCHAIN: go1.27.3

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      # The UI tests run headless (ui.NewTester), so no display is needed here.
      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./...

      # No dependency may pull cgo: the whole point of the stack is that
      # CGO_ENABLED=0 builds everywhere (docs/dependencies.md §2).
      # The list must be taken with cgo off: with it on, the standard library's
      # own cgo variants (net, os/user, runtime/cgo) answer, and on a runner
      # with a C toolchain that is every leg.
      - name: assert no cgo packages
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          out=$(go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./...)
          if [ -n "$out" ]; then
            echo "cgo dependencies found:"
            echo "$out"
            exit 1
          fi

      # mygo vet checks UI element lifetimes, which the compiler cannot.
      - name: mygo vet
        run: go run github.com/egoist/mygo/cmd/mygo@v0.7.3 vet ./...

  cross-build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -o "build/omo-${GOOS}-${GOARCH}${ext}" .
          ls -l "build/omo-${GOOS}-${GOARCH}${ext}"
